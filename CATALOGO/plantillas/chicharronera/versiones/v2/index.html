<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Clandestino | Catálogo Digital</title>
    
    <!-- Favicon (Icono de la pestaña del navegador) -->
    <link rel="icon" type="image/webp" href="logo.webp">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="banner">
            <div class="overlay"></div>
        </div>
        <div class="header-content">
            <div class="logo">
                <img src="logo.webp" alt="Logo">
            </div>

            <h1>Sabor Clandestino</h1>
            <p class="description">Las mejores hamburguesas y pizzas artesanales de la ciudad. Calidad que se nota en cada mordisco.</p>
            
            <div class="info-badges">
                <span class="info-badge">🕒 Lun - Dom: 12:00 PM - 10:00 PM</span>
                <a href="https://maps.app.goo.gl/MbvNaTnizErc6yMr5" target="_blank" rel="noopener noreferrer" class="info-badge" style="text-decoration: none; color: inherit;">
                    📍 Av. Central #123, Managua
                </a>
            </div>
            
            <div class="social-links">
                <a href="https://www.instagram.com/tu_usuario" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.facebook.com/tu_usuario" target="_blank" rel="noopener noreferrer">Facebook</a>
            </div>
            
            <a href="https://wa.me/50581878263" target="_blank" class="btn-whatsapp-header">
                Contáctanos por WhatsApp
            </a>
        </div>
    </header>

    <section class="controls-section">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar productos... (ej. Pizza, Hamburguesa)">
        </div>
        
        <div class="categories-container" id="categoriesContainer">
        </div>
    </section>

    <main class="products-container" id="productsContainer">
    </main>

    <button class="back-to-top" id="backToTopBtn" onclick="scrollToTop()">▲</button>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <img src="" alt="Producto" id="modalImage" class="modal-image">
            <div class="modal-body">
                <h3 id="modalTitle">Nombre del Producto</h3>
                <p id="modalDescription" class="modal-desc">Descripción</p>
                <div id="modalSpecs" class="modal-specs-container"></div>
                <p id="modalPrice" class="modal-price">C$ 0.00</p>
                
                <div class="modal-actions">
                    <a href="https://wa.me/50581878263" target="_blank" class="btn-whatsapp-consult" id="whatsappLink">Consultar por WhatsApp</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
